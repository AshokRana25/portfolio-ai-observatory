[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-ai-observatory"
version = "0.1.0"
description = "Evidence-backed project portfolio assistant with LangChain and Langfuse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langchain-core>=1,<2",
  "langchain-openai>=1,<2", "langfuse>=4,<5", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["observatory*"]

[tool.setuptools.package-data]
observatory = ["data/*.json", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
